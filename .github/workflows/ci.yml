name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - audit
          - build
          - deps-check
          - fmt-check
          - manifest-check
          - test
          - typecheck
          - workflow-check
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        uses: jdx/mise-action@v4.2.4 # Immutable release tag verified 2026-08-08.

      - name: Install dependencies
        run: mise run deps:install

      - name: Run ${{ matrix.task }}
        run: mise run ${{ matrix.task }}
