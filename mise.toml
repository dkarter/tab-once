[tools]
"github:crate-ci/committed" = "latest"
"cargo:resvg" = { version = "0.48.1", features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
actionlint = "1.7.12"
aube = "1.29.1"
dprint = "latest"
gitleaks = "latest"
lefthook = "latest"
node = "lts"
pitchfork = "latest"

[hooks]
postinstall = "lefthook install"

[tasks.fmt]
description = "Formats all supported files"
run = "dprint fmt"

[tasks.fmt-check]
description = "Checks formatting and fails on differences"
run = "dprint check"

[tasks.build]
description = "Builds the browser extension"
run = "aube run build"

[tasks."icons:generate"]
description = "Regenerates committed PNG icons from public/icon.svg"
run = "aube exec tsx scripts/generate-icons.ts"

[tasks.check]
description = "Runs all project checks"
depends = [
  "audit",
  "build",
  "deps-check",
  "fmt-check",
  "manifest-check",
  "test",
  "typecheck",
  "workflow-check",
]

[tasks.audit]
description = "Checks dependencies for known vulnerabilities"
run = "aube audit"

[tasks.deps-check]
description = "Checks the installed dependency tree"
run = "aube check"

[tasks.e2e]
description = "Tests duplicate-tab behavior in Chrome and Firefox"
run = "aube run e2e"

[tasks."e2e:chrome"]
description = "Tests duplicate-tab behavior in Chrome"
run = "aube run e2e -- chrome"

[tasks."e2e:firefox"]
description = "Tests duplicate-tab behavior in Firefox"
run = "aube run e2e -- firefox"

[tasks."deps:install"]
description = "Installs dependencies from the frozen lockfile"
run = "aube ci"

[tasks.manifest-check]
description = "Checks release and extension manifest metadata"
run = "aube exec tsx scripts/check-manifest.ts"

[tasks.package]
description = "Builds store and source archives"
depends = ["build"]
run = "aube exec tsx scripts/package.ts"

[tasks."publish:chrome"]
description = "Publishes the built extension to the Chrome Web Store"
depends = ["package"]
run = "mise run submit:chrome"

[tasks."publish:firefox"]
description = "Submits the built extension to Firefox Add-ons"
depends = ["package"]
run = "mise run submit:firefox"

[tasks."submit:chrome"]
description = "Submits prepared artifacts to the Chrome Web Store"
run = "aube exec tsx scripts/publish-chrome.ts"

[tasks."submit:firefox"]
description = "Submits prepared artifacts to Firefox Add-ons"
run = "aube exec tsx scripts/publish-firefox.ts"

[tasks."secrets:chrome"]
description = "Configures Chrome publishing secrets in GitHub Actions"
run = '''
printf '\nCHROME_EXTENSION_ID: Paste the Chrome Web Store item ID.\n'
gh secret set CHROME_EXTENSION_ID --app actions
printf '\nCHROME_PUBLISHER_ID: Paste the publisher ID from Publisher > Settings.\n'
gh secret set CHROME_PUBLISHER_ID --app actions
printf '\nCHROME_SERVICE_ACCOUNT_JSON: Paste the complete service-account JSON key.\n'
gh secret set CHROME_SERVICE_ACCOUNT_JSON --app actions
gh secret list --app actions
'''

[tasks."secrets:firefox"]
description = "Configures Firefox publishing secrets in GitHub Actions"
run = '''
printf '\nAMO_JWT_ISSUER: Paste the AMO API key / JWT issuer.\n'
gh secret set AMO_JWT_ISSUER --app actions
printf '\nAMO_JWT_SECRET: Paste the AMO API secret.\n'
gh secret set AMO_JWT_SECRET --app actions
gh secret list --app actions
'''

[tasks.test]
description = "Runs unit tests"
run = "aube test"

[tasks.typecheck]
description = "Checks TypeScript types"
run = "aube run typecheck"

[tasks.workflow-check]
description = "Checks GitHub Actions workflows"
run = "actionlint"
