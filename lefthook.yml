# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/master/schema.json

output:
  - summary

commit-msg:
  parallel: true
  jobs:
    - name: conventional commits
      run: mise exec -- committed --commit-file {1}

    - name: check secrets
      run: mise exec -- gitleaks git --pre-commit  --staged --verbose --no-banner --redact

pre-push:
  parallel: true
  jobs:
    - name: Audit dependencies
      run: mise run audit

    - name: Build extension
      run: mise run build

    - name: Check dependencies
      run: mise run deps-check

    - name: Check formatting
      run: mise run fmt-check

    - name: Check manifests
      run: mise run manifest-check

    - name: Run tests
      run: mise run test

    - name: Check types
      run: mise run typecheck

    - name: Check workflows
      run: mise run workflow-check
